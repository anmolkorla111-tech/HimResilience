<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="google-site-verification" content="_d4rfVbOnxNZ4pyj4mBnA7Vkf3m0RiCkIqEXkkp1Vmk" />
    <title>HimResilience | Emergency Disaster Portal</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#030712">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body {
            background-color: #050b14;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #map {
            height: 280px;
            width: 100%;
            border-radius: 0.85rem;
            z-index: 10;
        }
        .pulse-glow {
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.99); }
        }
        .beacon-active {
            animation: flash 0.3s infinite alternate;
        }
        @keyframes flash {
            from { background-color: #ef4444; }
            to { background-color: #ffffff; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 sm:p-4">

    <div class="w-full max-w-[430px] bg-[#090e17] border border-slate-800/80 rounded-[28px] shadow-2xl p-4 sm:p-5 flex flex-col space-y-3.5 relative overflow-hidden backdrop-blur-xl">

        <div class="flex items-center justify-between border-b border-slate-800/80 pb-3">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-base shadow-lg shadow-emerald-500/20">
                    🏔️
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-black text-sm tracking-wider text-white">HIMRESILIENCE</span>
                        <span class="text-[9px] bg-indigo-950 text-indigo-300 font-mono px-1.5 py-0.5 rounded border border-indigo-800/60 font-bold">SOS NODE</span>
                    </div>
                    <p class="text-[9px] text-slate-400 uppercase tracking-widest font-mono">INTEGRATED REGIONAL RAPID RESPONSE</p>
                </div>
            </div>
            <div class="flex items-center space-x-1 bg-emerald-950/60 border border-emerald-800/50 px-2 py-1 rounded-full text-[10px] text-emerald-400 font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span>LIVE SYNC</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center font-mono">
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-xl p-2">
                <div class="text-[9px] text-slate-400 uppercase">TEMP</div>
                <div id="dispTemp" class="text-xs font-bold text-amber-400 mt-0.5">18.5 °C</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-xl p-2">
                <div class="text-[9px] text-slate-400 uppercase">RAINFALL</div>
                <div id="dispRain" class="text-xs font-bold text-sky-400 mt-0.5">0.0 mm/h</div>
            </div>
            <div class="bg-slate-900/90 border border-slate-800/80 rounded-xl p-2">
                <div class="text-[9px] text-slate-400 uppercase">HUMIDITY</div>
                <div id="dispHumid" class="text-xs font-bold text-teal-400 mt-0.5">78 %</div>
            </div>
        </div>

        <button id="mainSosBtn" onclick="triggerMainSOS()" class="pulse-glow w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-red-600 via-red-500 to-rose-600 hover:from-red-500 hover:to-rose-500 active:scale-[0.98] text-white font-black text-sm tracking-wider uppercase shadow-lg shadow-red-600/30 flex items-center justify-center space-x-2 border border-red-400/30 transition">
            <span>🚨</span>
            <span>ONE-TAP EMERGENCY SOS</span>
        </button>

        <div class="grid grid-cols-2 gap-2">
            <button onclick="triggerSmsSOS()" class="bg-slate-900 hover:bg-slate-800 active:scale-[0.98] border border-slate-800 rounded-xl py-2.5 px-3 text-[11px] font-bold text-amber-400 flex items-center justify-center space-x-1.5 transition">
                <span>📶</span>
                <span>NO-NET GSM SOS</span>
            </button>
            <button id="beaconBtn" onclick="toggleRescueBeacon()" class="bg-slate-900 hover:bg-slate-800 active:scale-[0.98] border border-slate-800 rounded-xl py-2.5 px-3 text-[11px] font-bold text-rose-400 flex items-center justify-center space-x-1.5 transition">
                <span>🚨</span>
                <span id="beaconText">RESCUE BEACON</span>
            </button>
        </div>

        <button id="voiceBtn" onclick="toggleVoiceTrigger()" class="w-full bg-slate-900/90 hover:bg-slate-800 border border-slate-800/80 rounded-xl py-2 px-3 text-[11px] font-mono text-slate-300 flex items-center justify-center space-x-2 transition">
            <span id="voiceIcon">🎙️</span>
            <span id="voiceText">VOICE TRIGGER (SAY "HELP" / "BACHAO")</span>
        </button>

        <div class="bg-slate-900/90 border border-slate-800/80 rounded-2xl p-2 shadow-inner">
            <div id="map"></div>
        </div>

        <div class="space-y-2">
            <div class="flex items-center justify-between px-1">
                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">NEARBY VERIFIED SAFE HAVENS</span>
                <span class="text-[9px] bg-indigo-950/80 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-800/40 font-mono">OSM SPATIAL API</span>
            </div>

            <select id="shelterSelect" onchange="focusShelter()" class="w-full bg-slate-900 border border-slate-800 text-slate-200 text-xs rounded-xl px-3 py-2.5 outline-none focus:border-indigo-500 font-medium">
                <option value="0">IGMC Emergency & Trauma Center (0.8 km)</option>
                <option value="1">Annandale Air Rescue Base (1.4 km)</option>
                <option value="2">Ridge High Altitude Shelter (0.5 km)</option>
                <option value="3">Sanjauli Regional Relief Camp (2.1 km)</option>
            </select>

            <button onclick="drawEvacuationRoute()" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 active:scale-[0.98] text-white font-bold text-xs uppercase tracking-wider shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-1.5 transition">
                <span>📍</span>
                <span>DRAW EVACUATION ROUTE</span>
            </button>
        </div>

        <div class="text-center text-[9px] text-slate-600 font-mono pt-1">
            HimResilience Engine • OpenStreetMap Spatial API • Academic Research Prototype
        </div>

    </div>

    <script>
        let currentLat = 31.1048;
        let currentLng = 77.1734;
        let map, userMarker, routeLayer;
        let isBeaconActive = false;
        let beaconAudioCtx, beaconOsc;
        let recognition;
        let isListening = false;

        const shelters = [
            { name: "IGMC Emergency & Trauma Center", lat: 31.1069, lng: 77.1850, type: "Medical Center" },
            { name: "Annandale Air Rescue Base", lat: 31.1090, lng: 77.1510, type: "Air Rescue Base" },
            { name: "Ridge High Altitude Shelter", lat: 31.1048, lng: 77.1734, type: "Evac Camp" },
            { name: "Sanjauli Regional Relief Camp", lat: 31.1012, lng: 77.1985, type: "Relief Hub" }
        ];

        function initMap() {
            map = L.map('map', { zoomControl: true }).setView([currentLat, currentLng], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            shelters.forEach((s, idx) => {
                L.marker([s.lat, s.lng]).addTo(map)
                    .bindPopup(`<b>${s.name}</b><br><span style="color:#6366f1;">${s.type}</span>`);
            });

            locateLiveGPS();
        }

        function locateLiveGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (pos) => {
                        currentLat = pos.coords.latitude;
                        currentLng = pos.coords.longitude;

                        if (userMarker) {
                            userMarker.setLatLng([currentLat, currentLng]);
                        } else {
                            userMarker = L.circleMarker([currentLat, currentLng], {
                                radius: 8,
                                fillColor: "#ef4444",
                                color: "#ffffff",
                                weight: 2,
                                fillOpacity: 1
                            }).addTo(map).bindPopup("<b>📍 You Are Here</b>");
                        }
                    },
                    (err) => {},
                    { enableHighAccuracy: true }
                );
            }
        }

        function focusShelter() {
            const idx = document.getElementById("shelterSelect").value;
            const target = shelters[idx];
            map.setView([target.lat, target.lng], 14, { animate: true });
        }

        async function drawEvacuationRoute() {
            const idx = document.getElementById("shelterSelect").value;
            const target = shelters[idx];

            if (routeLayer) map.removeLayer(routeLayer);

            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${currentLng},${currentLat};${target.lng},${target.lat}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.routes && data.routes.length > 0) {
                    routeLayer = L.geoJSON(data.routes[0].geometry, {
                        style: { color: '#6366f1', weight: 5, opacity: 0.9 }
                    }).addTo(map);
                    map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
                } else {
                    drawFallbackRoute(target);
                }
            } catch (e) {
                drawFallbackRoute(target);
            }
        }

        function drawFallbackRoute(target) {
            routeLayer = L.polyline([[currentLat, currentLng], [target.lat, target.lng]], {
                color: '#6366f1',
                weight: 4,
                dashArray: '8, 8'
            }).addTo(map);
            map.fitBounds(routeLayer.getBounds(), { padding: [30, 30] });
        }

        async function triggerMainSOS() {
            const btn = document.getElementById("mainSosBtn");
            btn.innerHTML = "<span>📡</span><span>BROADCASTING DISTRESS...</span>";

            const payload = {
                lat: currentLat,
                lng: currentLng,
                emergency_type: "CRITICAL_LIVE_CITIZEN_SOS"
            };

            try {
                const res = await fetch("/api/sos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    btn.innerHTML = "<span>✅</span><span>DISTRESS RECEIVED BY SDRF</span>";
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
                }
            } catch (e) {
                btn.innerHTML = "<span>⚠️</span><span>OFFLINE: USE NO-NET GSM</span>";
            } finally {
                setTimeout(() => {
                    btn.innerHTML = "<span>🚨</span><span>ONE-TAP EMERGENCY SOS</span>";
                }, 3500);
            }
        }

        function triggerSmsSOS() {
            const msg = encodeURIComponent(`EMERGENCY SOS! I need immediate rescue. My GPS Coordinates: Lat ${currentLat.toFixed(4)}, Lng ${currentLng.toFixed(4)}. Map: https://maps.google.com/?q=${currentLat},${currentLng}`);
            window.location.href = `sms:112?body=${msg}`;
        }

        function toggleRescueBeacon() {
            isBeaconActive = !isBeaconActive;
            const btn = document.getElementById("beaconBtn");
            const txt = document.getElementById("beaconText");

            if (isBeaconActive) {
                txt.innerText = "BEACON ACTIVE";
                btn.classList.add("beacon-active");
                try {
                    beaconAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    beaconOsc = beaconAudioCtx.createOscillator();
                    beaconOsc.type = "sawtooth";
                    beaconOsc.frequency.setValueAtTime(800, beaconAudioCtx.currentTime);
                    beaconOsc.connect(beaconAudioCtx.destination);
                    beaconOsc.start();
                } catch (e) {}
            } else {
                txt.innerText = "RESCUE BEACON";
                btn.classList.remove("beacon-active");
                if (beaconOsc) {
                    beaconOsc.stop();
                    beaconAudioCtx.close();
                }
            }
        }

        function toggleVoiceTrigger() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Voice recognition is not supported on this browser.");
                return;
            }

            if (!isListening) {
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = "en-IN";

                recognition.onstart = () => {
                    isListening = true;
                    document.getElementById("voiceText").innerText = "LISTENING... (SAY 'HELP' OR 'BACHAO')";
                    document.getElementById("voiceIcon").innerText = "🔴";
                };

                recognition.onresult = (event) => {
                    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                    if (transcript.includes("help") || transcript.includes("bachao") || transcript.includes("emergency")) {
                        triggerMainSOS();
                    }
                };

                recognition.onerror = () => { stopListening(); };
                recognition.onend = () => { stopListening(); };

                recognition.start();
            } else {
                stopListening();
            }
        }

        function stopListening() {
            isListening = false;
            if (recognition) recognition.stop();
            document.getElementById("voiceText").innerText = "VOICE TRIGGER (SAY 'HELP' / 'BACHAO')";
            document.getElementById("voiceIcon").innerText = "🎙️";
        }

        async function fetchWeather() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&current_weather=true&hourly=precipitation,relativehumidity_2m`);
                const data = await res.json();
                if (data.current_weather) {
                    document.getElementById("dispTemp").innerText = `${data.current_weather.temperature} °C`;
                    document.getElementById("dispRain").innerText = `${data.hourly?.precipitation?.[0] || '0.0'} mm/h`;
                    document.getElementById("dispHumid").innerText = `${data.hourly?.relativehumidity_2m?.[0] || '80'} %`;
                }
            } catch (e) {}
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            initMap();
            fetchWeather();
        });
    </script>
</body>
</html>
